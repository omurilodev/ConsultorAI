<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Microsoluções — Banco de Ideias</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --black: #0a0a0a;
  --white: #fafaf8;
  --gray: #6b6b6b;
  --gray-light: #e8e8e4;
  --gray-soft: #f4f4f0;
  --border: #e0dbd2;
  --accent: #ff4d00;
  --accent-soft: #fff1ec;
  --green: #00875a;
  --green-soft: #e6f4ef;
  --blue: #0057ff;
  --blue-soft: #eef3ff;
  --purple: #6b21a8;
  --purple-soft: #f3e8ff;
  --amber: #b45309;
  --amber-soft: #fef3c7;
}

body {
  font-family: 'Lora', serif;
  background: var(--gray-soft);
  color: var(--black);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* HEADER */
.header {
  background: var(--black);
  padding: 48px;
  position: relative;
  overflow: hidden;
}

.header::before {
  content: '';
  position: absolute;
  top: -80px; right: -80px;
  width: 400px; height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,77,0,0.12) 0%, transparent 70%);
}

.header-tag {
  font-family: 'Syne', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 12px;
}

.header h1 {
  font-family: 'Syne', sans-serif;
  font-size: clamp(28px, 4vw, 42px);
  font-weight: 800;
  color: var(--white);
  letter-spacing: -0.02em;
  margin-bottom: 8px;
}

.header p {
  font-size: 15px;
  color: rgba(250,250,248,0.5);
  max-width: 480px;
}

.header-stats {
  display: flex;
  gap: 32px;
  margin-top: 32px;
  padding-top: 24px;
  border-top: 1px solid rgba(255,255,255,0.08);
  flex-wrap: wrap;
}

.stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.stat-num {
  font-family: 'Syne', sans-serif;
  font-size: 24px;
  font-weight: 800;
  color: var(--white);
  letter-spacing: -0.02em;
}

.stat-label {
  font-family: 'Syne', sans-serif;
  font-size: 11px;
  color: rgba(250,250,248,0.35);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* FILTERS */
.filters {
  padding: 24px 48px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  background: white;
  border-bottom: 1px solid var(--border);
}

.filter-btn {
  font-family: 'Syne', sans-serif;
  font-size: 12px;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: 999px;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--gray);
  cursor: pointer;
  transition: all 0.15s;
}

.filter-btn:hover { border-color: var(--accent); color: var(--accent); }
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
  padding: 40px 48px;
  max-width: 1400px;
  margin: 0 auto;
}

/* CARD */
.card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  transition: transform 0.2s, box-shadow 0.2s;
  position: relative;
  overflow: hidden;
}

.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.08);
}

.card-accent {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
}

.card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.card-icon {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.card-badges {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.badge {
  font-family: 'Syne', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 4px;
}

.badge-cat {
  background: var(--gray-soft);
  color: var(--gray);
}

.badge-dif-facil { background: var(--green-soft); color: var(--green); }
.badge-dif-medio { background: var(--amber-soft); color: var(--amber); }
.badge-dif-avancado { background: var(--accent-soft); color: var(--accent); }

.card-title {
  font-family: 'Syne', sans-serif;
  font-size: 17px;
  font-weight: 800;
  color: var(--black);
  letter-spacing: -0.01em;
  line-height: 1.2;
}

.card-desc {
  font-size: 14px;
  color: var(--gray);
  line-height: 1.65;
}

.card-divider {
  height: 1px;
  background: var(--gray-light);
}

.card-section-title {
  font-family: 'Syne', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--gray);
  margin-bottom: 8px;
}

.card-flow {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.flow-step {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: 'Syne', sans-serif;
  font-size: 12px;
  color: var(--black);
}

.flow-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}

.flow-arrow {
  color: var(--gray-light);
  font-size: 10px;
  margin-left: 3px;
}

.card-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.tool-pill {
  font-family: 'Syne', sans-serif;
  font-size: 11px;
  font-weight: 600;
  background: var(--gray-soft);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 3px 10px;
  color: var(--gray);
}

.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: auto;
  padding-top: 4px;
}

.card-ticket {
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 800;
  color: var(--black);
}

.card-ticket span {
  font-size: 11px;
  font-weight: 400;
  color: var(--gray);
  margin-left: 2px;
}

.card-status {
  font-family: 'Syne', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.15s;
}

.status-ideia { background: var(--gray-soft); color: var(--gray); border: 1px solid var(--border); }
.status-validado { background: var(--green-soft); color: var(--green); border: 1px solid rgba(0,135,90,0.2); }
.status-construindo { background: var(--blue-soft); color: var(--blue); border: 1px solid rgba(0,87,255,0.2); }
.status-pronto { background: var(--accent-soft); color: var(--accent); border: 1px solid rgba(255,77,0,0.2); }

/* ADD CARD */
.add-card {
  background: transparent;
  border: 2px dashed var(--border);
  border-radius: 16px;
  padding: 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  cursor: pointer;
  transition: all 0.2s;
  min-height: 200px;
}

.add-card:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.add-icon {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  border: 1.5px dashed var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.4;
  color: var(--gray);
}

.add-text {
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: var(--gray);
}

/* MODAL */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,10,10,0.7);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 24px;
  backdrop-filter: blur(4px);
}

.modal-overlay.active { display: flex; }

.modal-box {
  background: white;
  border-radius: 16px;
  padding: 40px;
  max-width: 480px;
  width: 100%;
  animation: popIn 0.2s ease;
  max-height: 90vh;
  overflow-y: auto;
}

@keyframes popIn {
  from { opacity: 0; transform: scale(0.94) translateY(10px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-title {
  font-family: 'Syne', sans-serif;
  font-size: 20px;
  font-weight: 800;
  color: var(--black);
  letter-spacing: -0.02em;
  margin-bottom: 24px;
}

.modal-field { margin-bottom: 16px; }

.modal-field label {
  display: block;
  font-family: 'Syne', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gray);
  margin-bottom: 6px;
}

.modal-field input,
.modal-field textarea,
.modal-field select {
  width: 100%;
  font-family: 'Lora', serif;
  font-size: 14px;
  color: var(--black);
  background: var(--gray-soft);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  outline: none;
  transition: border-color 0.2s;
  resize: vertical;
}

.modal-field input:focus,
.modal-field textarea:focus,
.modal-field select:focus { border-color: var(--accent); background: white; }

.modal-field textarea { min-height: 72px; line-height: 1.6; }

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 24px;
}

.modal-cancel {
  flex: 1;
  background: var(--gray-soft);
  border: none;
  border-radius: 8px;
  padding: 12px;
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: var(--gray);
  cursor: pointer;
}

.modal-confirm {
  flex: 2;
  background: var(--accent);
  border: none;
  border-radius: 8px;
  padding: 12px;
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: white;
  cursor: pointer;
  transition: opacity 0.2s;
}

.modal-confirm:hover { opacity: 0.88; }

.page-nav {
  display: flex;
  align-items: center;
  gap: 2px;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid rgba(255,255,255,0.08);
  flex-wrap: wrap;
}
.page-nav-link {
  font-family: 'Syne', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  text-decoration: none;
  color: rgba(250,250,248,0.35);
  padding: 5px 12px;
  border-radius: 6px;
  transition: color 0.15s, background 0.15s;
  white-space: nowrap;
}
.page-nav-link:hover { color: rgba(250,250,248,0.75); background: rgba(255,255,255,0.06); }
.page-nav-link.active { color: var(--accent); }

@media (max-width: 600px) {
  .header { padding: 28px 20px; }
  .header h1 { font-size: clamp(22px, 5vw, 32px); }
  .header-stats { gap: 20px; margin-top: 20px; padding-top: 16px; }
  .filters { padding: 12px 16px; gap: 6px; }
  .grid { padding: 20px 16px; grid-template-columns: 1fr; gap: 14px; }
  .page-nav { gap: 0; }
  .page-nav-link { font-size: 10px; padding: 4px 10px; }
}

@media (max-width: 400px) {
  .header { padding: 20px 16px; }
  .stat-num { font-size: 20px; }
  .card { padding: 20px; }
  .page-nav-link { font-size: 9px; padding: 3px 8px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-tag">Consultor AI</div>
  <h1>Banco de Microsoluções</h1>
  <p>Ideias de automações e integrações para oferecer a clientes. Clique no status para atualizar.</p>
  <div class="header-stats">
    <div class="stat">
      <div class="stat-num" id="total-count">0</div>
      <div class="stat-label">Total de ideias</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="validado-count">0</div>
      <div class="stat-label">Validadas</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="pronto-count">0</div>
      <div class="stat-label">Prontas</div>
    </div>
  </div>
  <nav class="page-nav">
    <a href="crm.html" class="page-nav-link">CRM</a>
    <a href="form.html" class="page-nav-link">Formulário</a>
    <a href="script.html" class="page-nav-link">Script</a>
    <a href="microsolutions.html" class="page-nav-link active">Microsoluções</a>
  </nav>
</div>

<div class="filters">
  <button class="filter-btn active" onclick="filterCards('todos')">Todas</button>
  <button class="filter-btn" onclick="filterCards('produtividade')">Produtividade</button>
  <button class="filter-btn" onclick="filterCards('comunicacao')">Comunicação</button>
  <button class="filter-btn" onclick="filterCards('vendas')">Vendas</button>
  <button class="filter-btn" onclick="filterCards('gestao')">Gestão</button>
  <button class="filter-btn" onclick="filterCards('facil')">Fácil</button>
</div>

<div class="grid" id="grid"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-title">Nova microsolução</div>
    <div class="modal-field">
      <label>Nome da solução</label>
      <input type="text" id="m-nome" placeholder="Ex: Resumo de emails diário">
    </div>
    <div class="modal-field">
      <label>Descrição</label>
      <textarea id="m-desc" placeholder="O que essa solução faz e qual problema resolve..."></textarea>
    </div>
    <div class="modal-field">
      <label>Fluxo (um passo por linha)</label>
      <textarea id="m-fluxo" placeholder="Gmail&#10;Groq&#10;WhatsApp"></textarea>
    </div>
    <div class="modal-field">
      <label>Ferramentas</label>
      <input type="text" id="m-tools" placeholder="n8n, Groq, Gmail (separados por vírgula)">
    </div>
    <div class="modal-field">
      <label>Categoria</label>
      <select id="m-cat">
        <option value="produtividade">Produtividade</option>
        <option value="comunicacao">Comunicação</option>
        <option value="vendas">Vendas</option>
        <option value="gestao">Gestão</option>
      </select>
    </div>
    <div class="modal-field">
      <label>Dificuldade</label>
      <select id="m-dif">
        <option value="facil">Fácil</option>
        <option value="medio">Médio</option>
        <option value="avancado">Avançado</option>
      </select>
    </div>
    <div class="modal-field">
      <label>Ticket estimado</label>
      <input type="text" id="m-ticket" placeholder="Ex: R$ 800 – 1.500">
    </div>
    <div class="modal-field">
      <label>Ícone</label>
      <select id="m-icon">
        <option value="zap">Automação</option>
        <option value="mail">Email / Inbox</option>
        <option value="mic">Áudio / Reunião</option>
        <option value="calendar">Agenda</option>
        <option value="message">Comunicação</option>
        <option value="trending">Vendas / Crescimento</option>
        <option value="settings">Configuração</option>
        <option value="file">Documento / Relatório</option>
        <option value="users">Clientes / Equipe</option>
        <option value="search">Análise / Busca</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeModal()">Cancelar</button>
      <button class="modal-confirm" onclick="addCard()">Adicionar →</button>
    </div>
  </div>
</div>

<script>
const ICONS = {
  mail:     `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg>`,

  trending: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>`,

  file:     `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>`,
  users:    `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
  search:   `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,

const CAT_COLORS_SOFT = {
  produtividade: '#eef3ff',
  comunicacao:   '#e6f4ef',
  vendas:        '#fff1ec',
  gestao:        '#f3e8ff',
};

const CAT_COLORS = {
  produtividade: '#0057ff',
  comunicacao:   '#00875a',
  vendas:        '#ff4d00',
  gestao:        '#6b21a8',
};

const STATUS_CYCLE = ['ideia', 'validado', 'construindo', 'pronto'];
const STATUS_LABELS = {
  ideia:       'Ideia',
  validado:    'Validado ✓',
  construindo: 'Construindo',
  pronto:      'Pronto 🚀',
};

let cards = JSON.parse(localStorage.getItem('microsolutions') || 'null') || [
  {
    id: 1, icon: 'mail', nome: 'Resumo de emails diário',
    desc: 'Todo dia de manhã, o cliente recebe um resumo dos emails importantes no canal que preferir — WhatsApp, email ou Notion. Filtra automaticamente propagandas e notificações.',
    fluxo: ['Gmail — busca emails', 'Groq — resume e filtra', 'Destino — entrega o resumo'],
    tools: ['n8n', 'Gmail', 'Groq', 'WhatsApp / Email'],
    cat: 'produtividade', dif: 'facil', ticket: 'R$ 500 – 1.200', status: 'validado'
  },
  {
    id: 2, icon: 'mic', nome: 'Transcrição e resumo de reuniões',
    desc: 'Cliente sobe o áudio ou vídeo da reunião numa interface simples. Em segundos recebe a transcrição completa, resumo executivo, decisões tomadas e próximos passos com responsáveis.',
    fluxo: ['Interface web — upload do arquivo', 'Groq Whisper — transcrição', 'Groq LLM — resumo e estrutura', 'Interface — exibe o resultado'],
    tools: ['n8n', 'Groq Whisper', 'Groq LLM', 'Supabase'],
    cat: 'produtividade', dif: 'medio', ticket: 'R$ 1.200 – 2.500', status: 'ideia'
  },
  {
    id: 3, icon: 'calendar', nome: 'Briefing diário da agenda',
    desc: 'Toda manhã o cliente recebe um resumo da agenda do dia com contexto — quem são as pessoas nas reuniões, o que foi discutido antes, e o que precisa preparar.',
    fluxo: ['Google Calendar — busca eventos do dia', 'Groq — gera contexto e briefing', 'WhatsApp / Email — entrega o briefing'],
    tools: ['n8n', 'Google Calendar', 'Groq', 'WhatsApp'],
    cat: 'produtividade', dif: 'facil', ticket: 'R$ 500 – 1.000', status: 'ideia'
  },
];

let activeFilter = 'todos';

function save() {
  localStorage.setItem('microsolutions', JSON.stringify(cards));
}

function updateStats() {
  document.getElementById('total-count').textContent = cards.length;
  document.getElementById('validado-count').textContent = cards.filter(c => c.status === 'validado' || c.status === 'pronto').length;
  document.getElementById('pronto-count').textContent = cards.filter(c => c.status === 'pronto').length;
}

function cycleStatus(id) {
  const card = cards.find(c => c.id === id);
  if (!card) return;
  const idx = STATUS_CYCLE.indexOf(card.status);
  card.status = STATUS_CYCLE[(idx + 1) % STATUS_CYCLE.length];
  save();
  render();
}

function deleteCard(id) {
  if (!confirm('Remover essa microsolução?')) return;
  cards = cards.filter(c => c.id !== id);
  save();
  render();
}

function render() {
  const grid = document.getElementById('grid');
  const filtered = activeFilter === 'todos'
    ? cards
    : activeFilter === 'facil'
      ? cards.filter(c => c.dif === 'facil')
      : cards.filter(c => c.cat === activeFilter);

  grid.innerHTML = filtered.map(c => `
    <div class="card" data-cat="${c.cat}">
      <div class="card-accent" style="background:${CAT_COLORS[c.cat]}"></div>
      <div class="card-top">
        <div class="card-icon" style="background:${CAT_COLORS_SOFT[c.cat]};color:${CAT_COLORS[c.cat]}">${ICONS[c.icon] || ICONS.zap}</div>
        <div class="card-badges">
          <span class="badge badge-cat">${c.cat}</span>
          <span class="badge badge-dif-${c.dif}">${c.dif}</span>
        </div>
      </div>
      <div class="card-title">${c.nome}</div>
      <div class="card-desc">${c.desc}</div>
      <div class="card-divider"></div>
      <div>
        <div class="card-section-title">Fluxo</div>
        <div class="card-flow">
          ${c.fluxo.map((step, i) => `
            <div class="flow-step">
              <div class="flow-dot" style="background:${CAT_COLORS[c.cat]}"></div>
              ${step}
              ${i < c.fluxo.length - 1 ? '' : ''}
            </div>
          `).join('')}
        </div>
      </div>
      <div>
        <div class="card-section-title">Ferramentas</div>
        <div class="card-tools">
          ${c.tools.map(t => `<span class="tool-pill">${t}</span>`).join('')}
        </div>
      </div>
      <div class="card-footer">
        <div class="card-ticket">${c.ticket} <span>estimado</span></div>
        <div style="display:flex;gap:8px;align-items:center">
          <span style="font-size:11px;color:#ccc;cursor:pointer;font-family:Syne,sans-serif" onclick="deleteCard(${c.id})">✕</span>
          <div class="card-status status-${c.status}" onclick="cycleStatus(${c.id})">${STATUS_LABELS[c.status]}</div>
        </div>
      </div>
    </div>
  `).join('') + `
    <div class="add-card" onclick="openModal()">
      <div class="add-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
      <div class="add-text">Nova microsolução</div>
    </div>
  `;

  updateStats();
}

function filterCards(cat) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function openModal() {
  document.getElementById('modal').classList.add('active');
  setTimeout(() => document.getElementById('m-nome').focus(), 100);
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

function addCard() {
  const nome = document.getElementById('m-nome').value.trim();
  if (!nome) { alert('Informe o nome da solução.'); return; }

  const fluxoRaw = document.getElementById('m-fluxo').value.trim();
  const toolsRaw = document.getElementById('m-tools').value.trim();

  const card = {
    id: Date.now(),
    icon:   document.getElementById('m-icon').value || 'zap',
    nome,
    desc:   document.getElementById('m-desc').value.trim(),
    fluxo:  fluxoRaw ? fluxoRaw.split('\n').map(s => s.trim()).filter(Boolean) : [],
    tools:  toolsRaw ? toolsRaw.split(',').map(s => s.trim()).filter(Boolean) : [],
    cat:    document.getElementById('m-cat').value,
    dif:    document.getElementById('m-dif').value,
    ticket: document.getElementById('m-ticket').value.trim() || 'A definir',
    status: 'ideia'
  };

  cards.unshift(card);
  save();
  closeModal();
  render();

  // Clear fields
  ['m-nome','m-desc','m-fluxo','m-tools','m-ticket'].forEach(id => {
    document.getElementById(id).value = '';
  });
}

document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

render();
</script>
</body>
</html>
